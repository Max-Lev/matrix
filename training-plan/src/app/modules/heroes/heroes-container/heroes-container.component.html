<div class="train" [style.display]="(!isTrainLink) ? 'none' : 'block'">
    <button (click)="trainLink()" mat-raised-button color="primary">Train</button>
</div>
<!-- <div class="train" [style.visibility]="(isTrainLink) ? 'visible' : 'hidden'"> -->
    <!-- <div class="train" [style.display]="(!isTrainLink) ? 'none' : 'block'"> -->
    <button (click)="logOut()" mat-raised-button color="primary">Log Out</button>
<!-- </div> -->

<section class="container">
    <ng-container *ngFor="let hero of heroes$ | async">

        <app-card #card (selectHeroActionEmitter)="selectHeroActionHandler($event)" [hero]="hero">

            <ng-container train>
                <mat-card-actions>
                    <ng-container *ngIf="hero.trainer===null || hero.trainer==='null';else selected">
                        <button mat-button (click)="card.selectHeroAction({hero,action:actionType.SELECT})">Select
                        </button>
                    </ng-container>
                    <ng-template #selected>
                        <button mat-button
                            (click)="card.selectHeroAction({hero,action:actionType.UNSELECT})">Training</button>
                    </ng-template>
                </mat-card-actions>
            </ng-container>

        </app-card>

    </ng-container>
</section>
